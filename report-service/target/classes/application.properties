spring.application.name=report-service
server.port=${SERVER_PORT:8081}

spring.datasource.url=${REPORT_DB_URL:jdbc:postgresql://localhost:5432/report_feedback}
spring.datasource.username=${REPORT_DB_USER:postgres}
spring.datasource.password=${REPORT_DB_PASS:admin}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=false
	
jwt.public.key=classpath:app.pub

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}